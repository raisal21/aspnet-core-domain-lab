# Bab 1 — Application Host boundary: Compose menjalankan API dan PostgreSQL dengan health-gated startup.
# Bab 12 — environment connection string dan volume mendukung persistence/migration workflow.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-domainlab}
      POSTGRES_USER: ${POSTGRES_USER:-domainlab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-domainlab_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-domainlab} -d ${POSTGRES_DB:-domainlab}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      Database__ApplyMigrations: "true"
      Database__SeedDevelopmentData: "true"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-aspnet-core-domain-lab-dev-signing-key-change-me-2026}
      ConnectionStrings__DomainDb: Host=postgres;Port=5432;Database=${POSTGRES_DB:-domainlab};Username=${POSTGRES_USER:-domainlab};Password=${POSTGRES_PASSWORD:-domainlab_dev_only};GSS Encryption Mode=Disable
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
